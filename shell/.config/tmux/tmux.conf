# Prefix — Ctrl-a, Ctrl-a Ctrl-a sends a literal C-a to the inner shell.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# True color + styled underlines. xterm-ghostty entry covers Ghostty's TERM.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB,*:usstyle"

# Pass focus events through to inner programs (vim/zed/etc.).
set -g focus-events on

# Mouse
set -g mouse on

# 1-based indexing, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Snappier escape, deep scrollback
set -sg escape-time 10
set -g history-limit 50000

# Splits — pictorial: '-' for a horizontal divider, '/' for a vertical one.
# All new panes/windows inherit the current pane's working directory.
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind / split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Copy mode — vi keys, copy to system clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Status bar — informational, inherits terminal theme via ANSI names.
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=white"

set -g status-left-length 40
set -g status-left "#[fg=green]#h #[fg=white]| #[fg=cyan]#S "

set -g status-right-length 50
set -g status-right "#[fg=yellow]%Y-%m-%d #[fg=cyan]%H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=black,bg=cyan,bold] #I:#W "

# Plugins — TPM. After first install, hit prefix + I to fetch.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# TPM init — must be the very last line.
run '~/.config/tmux/plugins/tpm/tpm'
