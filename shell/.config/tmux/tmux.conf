# Prefix — Ctrl-a, Ctrl-a Ctrl-a sends a literal C-a to the inner shell.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# True color and styled underlines. The xterm-ghostty entry covers Ghostty's
# TERM. "clipboard" tells tmux that Ghostty accepts OSC 52 copies.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB:clipboard,*:usstyle"

# Pass focus events through to inner programs (vim/zed/etc.).
set -g focus-events on

# Mouse
set -g mouse on

# 1-based indexing, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Short escape delay, long scrollback, messages shown for 4 seconds.
set -sg escape-time 10
set -g history-limit 50000
set -g display-time 4000
setw -g aggressive-resize on

# Splits — pictorial: '-' for a horizontal divider, '/' for a vertical one.
# All new panes/windows inherit the current pane's working directory.
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind / split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Panes, Colemak: a left, r down, s up, w right. Capitals resize.
# -r lets you press the key again without the prefix.
bind -r a select-pane -L
bind -r r select-pane -D
bind -r s select-pane -U
bind -r w select-pane -R
bind -r A resize-pane -L 5
bind -r R resize-pane -D 5
bind -r S resize-pane -U 5
bind -r W resize-pane -R 5

# Session and window picker (s and w are taken by the pane keys).
bind f choose-tree -Z

# Previous and next window.
bind -r < previous-window
bind -r > next-window

# Close a pane or window without asking.
bind x kill-pane
bind X kill-window

# Reload this file.
bind o source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Copy mode with vi keys. tmux sends copies to the terminal (OSC 52), and
# Ghostty puts them on the macOS clipboard. This also works over SSH.
# "external" means programs inside tmux can't set the clipboard themselves.
set -s set-clipboard external
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Status bar — Catppuccin Mocha palette (hex for true-color fidelity).
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#cdd6f4,bg=#1e1e2e"

set -g status-left-length 40
set -g status-left "#[fg=#a6e3a1]#h #[fg=#6c7086]| #[fg=#89dceb]#S "

set -g status-right-length 50
set -g status-right "#[fg=#f9e2af]%Y-%m-%d #[fg=#89dceb]%H:%M "

setw -g window-status-format "#[fg=#a6adc8] #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89dceb,bold] #I:#W "

# Pane borders matched to the surface tones.
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89dceb"

# Message and command-mode styling.
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#cdd6f4,bg=#313244"

# Settings for all Macs and for this Mac only, from the private config repo.
source-file -q ~/.config/local-shared/tmux.conf
source-file -q ~/.config/local/tmux.conf

# Plugins with TPM. After the first install, press prefix + I to fetch them.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Start TPM if it is installed. This must stay the last line.
if-shell "test -x ~/.config/tmux/plugins/tpm/tpm" "run '~/.config/tmux/plugins/tpm/tpm'"
