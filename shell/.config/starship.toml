# Two-line minimal prompt with Catppuccin Mocha palette.
add_newline = true

# $username and $hostname only show over SSH (and username as root).
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$ruby\
$golang\
$rust\
$line_break\
$character"""

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[character]
success_symbol = "[❯](sky bold)"
error_symbol = "[❯](red bold)"
vimcmd_symbol = "[❮](green bold)"

[directory]
style = "blue bold"
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = ""
format = " on [$branch]($style)"
style = "mauve bold"

[git_status]
format = " [$all_status$ahead_behind]($style)"
style = "yellow"
conflicted = "!"
untracked = "?"
modified = "✗"
staged = "+"
renamed = "»"
deleted = "✘"
stashed = '\$'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"

[cmd_duration]
disabled = true

# Language modules — only appear inside a project of that type.
[nodejs]
format = " via [node $version]($style)"
style = "green"

[python]
format = " via [py $version]($style)"
style = "yellow"

[ruby]
format = " via [ruby $version]($style)"
style = "red"

[golang]
format = " via [go $version]($style)"
style = "sky"

[rust]
format = " via [rust $version]($style)"
style = "peach"
